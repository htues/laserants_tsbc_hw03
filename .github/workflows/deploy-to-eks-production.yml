name: Deploy to AWS EKS (Production)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Build the application
        run: npm run build

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker images
        run: |
          docker build -t hftamayo/ecommerce_monorepo:0.1.1 .
          docker push hftamayo/ecommerce_monorepo:0.1.1
          docker build -t hftamayo/pgecommerce:0.0.1 .
          docker push hftamayo/pgecommerce:0.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v1
        with:
          version: 'latest'

      - name: Deploy to AWS EKS (Production)
        run: |
          kubectl apply -f ./k8s/eks/deployment.yaml
          kubectl apply -f ./k8s/eks/service.yaml
          kubectl apply -f ./k8s/common/postgres-deployment.yaml
          kubectl apply -f ./k8s/common/postgres-service.yaml